# Build and test KAT Mobile on every push and pull request.
#
# build: the JVM unit tests run first, because they write the .fob that the Rust test
# fob_interop reads back with desktop KAT's own parser; then lint, the Rust tests and both APKs.
# emulator: the instrumentation tests (app/src/androidTest) on an Android 14 emulator, which load
# the native receive core on Android. They run in the separate ".qa" debug app, the way
# Build.ps1 -DeviceTests runs them on a phone.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NDK_VERSION: 27.2.12479018

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Install the NDK and Rust
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          rustup toolchain install stable --profile minimal --target aarch64-linux-android,x86_64-linux-android
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Unit tests and lint
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug

      - name: Rust tests
        working-directory: native
        run: cargo test --locked

      - name: Build the APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Upload the APKs
        uses: actions/upload-artifact@v7
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Upload the reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: app/build/reports
          retention-days: 14

  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Install the NDK and Rust
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          rustup toolchain install stable --profile minimal --target x86_64-linux-android
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Build the QA app and its tests
        run: ./gradlew --no-daemon -PkatAbis=x86_64 assembleDebug assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell pm grant io.karazajac.katmobile.qa android.permission.POST_NOTIFICATIONS
            adb shell am instrument -w -e class app.katmobile.AppTest,app.katmobile.FlipperDeviceTest io.karazajac.katmobile.qa.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation.txt
            adb exec-out run-as io.karazajac.katmobile.qa tar -cf - files/qa > screenshots.tar || true
            grep -q 'OK (' instrumentation.txt

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation
          path: |
            instrumentation.txt
            screenshots.tar
          retention-days: 14
